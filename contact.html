<div class="colorlib-contact">
    <div class="colorlib-narrow-content">

        <div class="row">
            <div class="col-md-12 animate-box" data-animate-effect="fadeInLeft">
                <span class="heading-meta">Contatti</span>
                <h2 class="colorlib-heading">Richiedi una prima consulenza gratuita</h2>
            </div>
        </div>

        <div class="row">

            <!-- INFO CONTATTO -->
            <div class="col-md-5">

                <div class="colorlib-feature colorlib-feature-sm animate-box" data-animate-effect="fadeInLeft">
                    <div class="colorlib-icon">
                        <i class="icon-globe-outline"></i>
                    </div>
                    <div class="colorlib-text">
                        <p><a href="mailto:almadesignstudio@outlook.it">almadesignstudio@outlook.it</a></p>
                    </div>
                </div>

                <div class="colorlib-feature colorlib-feature-sm animate-box" data-animate-effect="fadeInLeft">
                    <div class="colorlib-icon">
                        <i class="icon-map"></i>
                    </div>
                    <div class="colorlib-text">
                        <p>Torino, Italia</p>
                    </div>
                </div>

                <!-- TELEFONO RIMOSSO CORRETTAMENTE (non rompe il layout) -->

            </div>

            <!-- FORM -->
            <div class="col-md-7 col-md-push-1">
                <div class="row">
                    <div class="col-md-10 col-md-offset-1 col-md-pull-1 animate-box" data-animate-effect="fadeInLeft">

                        <form action="mailto:almadesignstudio@outlook.it" method="post" enctype="text/plain">

                            <div class="form-group">
                                <input type="text" class="form-control" name="name" placeholder="Nome" required>
                            </div>

                            <div class="form-group">
                                <input type="email" class="form-control" name="email" placeholder="Email" required>
                            </div>

                            <div class="form-group">
                                <input type="text" class="form-control" name="subject" placeholder="Oggetto">
                            </div>

                            <div class="form-group">
                                <textarea name="message" cols="30" rows="7" class="form-control" placeholder="Messaggio" required></textarea>
                            </div>

                            <div class="form-group">
                                <input type="submit" class="btn btn-primary btn-send-message" value="Invia">
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
